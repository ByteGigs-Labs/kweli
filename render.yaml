# Render Blueprint. Dashboard: New > Blueprint > pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
# Before submission (12 Nov): move kweli-api off the free plan so judges don't hit a cold start,
# and check the free Postgres expiry. Judging runs until 21 Dec 2026.
services:
  - type: web
    name: kweli-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kweli-db
          property: connectionString
      - key: HMAC_KEY
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://kweli-web.onrender.com
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: PAYPAL_MERCHANT_ID
        sync: false
      # From `python -m scripts.create_pro_plan`. Billing (and the Pro paywall) stays off until set.
      - key: PAYPAL_PLAN_ID
        sync: false
      # Seeds the demo login and synthetic ledger on start. Idempotent: it never duplicates.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://kweli-web.onrender.com"]'
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: kweli-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        # AG Grid's theming injects <style> tags, hence 'unsafe-inline' for styles only.
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # The browser only ever talks to kweli-web, so the session cookie is first-party and
      # SameSite=Strict works. onrender.com is a public suffix: kweli-web and kweli-api would
      # otherwise be different sites and the cookie would never be sent.
      - type: rewrite
        source: /v1/*
        destination: https://kweli-api.onrender.com/v1/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kweli-db
    plan: free
    region: frankfurt
    databaseName: kweli
    user: kweli
