name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kweli
          POSTGRES_PASSWORD: kweli-ci
          POSTGRES_DB: kweli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kweli -d kweli_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kweli:kweli-ci@127.0.0.1:5432/kweli_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=api --cov=paypal --cov=proof --cov=audit --cov=vault --cov=scripts --cov-fail-under=85
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-agent.txt pytest==9.1.1 pip-audit==2.10.1
      - run: pip install --no-deps paypal-agent-toolkit==1.11.0
      - run: pytest -q tests/test_agent_spike.py tests/test_agent_tools.py -p no:cacheprovider
      - run: pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source /repo --redact --no-banner

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build api
      - name: App imports inside the built image
        run: docker compose run --rm --no-deps api python -c "import api.main, scripts.seed, scripts.demo_data, scripts.refresh_payers"
