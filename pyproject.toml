[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S311"]
"scripts/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
